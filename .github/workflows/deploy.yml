name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: read # read @j0nathan-ll0yd/* from GitHub Packages during pnpm install

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # --json emits structured (NDJSON) build logs for CI log triage. Scoped to
        # deploy workflows only; local `pnpm build` stays human-readable. pnpm forwards
        # trailing args to the script directly (no `--` separator needed), preserving the
        # prebuild/postbuild lifecycle hooks. Nothing downstream parses the human log format.
        run: pnpm build --json

      - name: Check that no test-only Worker variable is set
        # atlas decision 0160, PR B. DATA_PLANE_BASE (a fixture data plane) and SSR_FAULT_INJECTION
        # (the Step 6.10 fault header) are for tests and the PR preview only.
        run: node scripts/check-deploy-vars.mjs

      - name: Deploy the rate-limiter Worker
        # The developer API's ApiRateLimiter Durable Object runs in its own Worker,
        # human-datastream-rate-limiter (workers/rate-limiter/wrangler.jsonc), because Cloudflare
        # generates no Version URL for a Worker that implements a Durable Object
        # (developers.cloudflare.com/workers/configuration/previews/, Limitations). It deploys FIRST:
        # the site Worker binds the class through `script_name`, so the class must exist before the
        # site deploy names it. A failure here fails the job before the site deploy runs, and
        # production keeps serving the previous site version. `--config` names this Worker's own
        # file; the site deploy below reads the build's generated config.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config workers/rate-limiter/wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        # atlas decision 0160, PR A. `astro build` wrote dist/server/wrangler.json and the
        # .wrangler/deploy/config.json pointer to it, so `wrangler deploy` reads the generated
        # config: the Worker bundle in dist/server/ and the static assets in dist/client/. It
        # also applies workers_dev and preview_urls from wrangler.jsonc. The Worker serves
        # jonathanlloyd.me only after the plan Step 3.7 cutover attaches the hostname.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Purge stale production cache metadata
        # Cloudflare's zone cache can retain an unchanged asset's old response
        # headers across deploys and 304 revalidation (observed on Pages). Purging after
        # the new deployment makes cross-cutting _headers changes atomic with the
        # release instead of waiting for per-PoP eviction.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 30 \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | node --input-type=module -e '
                let body = ""
                for await (const chunk of process.stdin) body += chunk
                const result = JSON.parse(body)
                if (!result.success) {
                  console.error("Cloudflare cache purge failed:", JSON.stringify(result.errors))
                  process.exit(1)
                }
                console.log("Cloudflare production zone cache purged.")
              '

      - name: Notify backend of new deploy
        # Lets already-open dashboard tabs pick up the new build in real time via
        # the WebSocket push (backend POST /deploy/notify -> broadcast app-update).
        # Best-effort: the service worker's hourly update check is the guaranteed
        # backstop, so a failure here must never fail the deploy. The sleep gives
        # Cloudflare edge PoPs time to serve the new sw.js before clients re-check.
        # No-op until the DEPLOY_NOTIFY_* secrets are configured.
        continue-on-error: true
        env:
          DEPLOY_NOTIFY_URL: ${{ secrets.DEPLOY_NOTIFY_URL }}
          DEPLOY_NOTIFY_TOKEN: ${{ secrets.DEPLOY_NOTIFY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_NOTIFY_URL" ]; then
            echo "DEPLOY_NOTIFY_URL not set; skipping deploy notification."
            exit 0
          fi
          sleep 30
          # --connect-timeout/--max-time are load-bearing: continue-on-error only
          # swallows a non-zero EXIT, not a HANG. Without a bound, an unresponsive
          # notify backend leaves this curl running until the job timeout (~14 min),
          # which cancels the job and reports the whole deploy as FAILED even though
          # Build + Deploy to Cloudflare Workers already succeeded -- and a red deploy
          # skips the post-deploy smoke check (workflow_run.conclusion != success).
          # Observed on runs 29775663681 (#139) and 29779665862 (#140).
          curl -fsS --connect-timeout 5 --max-time 20 -X POST "$DEPLOY_NOTIFY_URL" \
            -H "Authorization: Bearer $DEPLOY_NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"build\":\"${GITHUB_SHA}\"}"

  check-images:
    # cfedge: the self-hosted Linux fleet reaches CloudFront only from the cfedge
    # egress lane (ci-runners-private #130, atlas decisions 0085 and 0088). Without
    # the label, every deploy from 2026-08-28 to 2026-10-10 printed `fetch failed`
    # for focus.json, books.json and theatre-reviews.json, and the check measured
    # nothing. audits/__tests__/deploy-workflow.test.ts keeps the label.
    runs-on: [self-hosted, linux, arm64, node, cfedge]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # fetch-images.mjs imports @j0nathan-ll0yd/portal-contract, so this job needs
      # the dependencies installed. Without it the script dies with
      # ERR_MODULE_NOT_FOUND before it can check anything.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for new images
        id: check
        continue-on-error: true
        # A step timeout fails the step without cancelling the job, so the
        # reconcile step below still runs and reads the empty output as failure.
        # A job timeout would cancel the job and skip it.
        timeout-minutes: 10
        run: node scripts/fetch-images.mjs --check-only

      - name: Publish image audit report
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Image mirror audit'
            echo
            echo "Status: \`${CHECK_STATUS:-not reported}\`"
            echo
            echo '```'
            if [ -f image-audit-report.txt ]; then cat image-audit-report.txt; else echo '(no report written; inspect the check step log)'; fi
            echo '```'
            echo
            echo 'To update the mirror: run `pnpm run fetch:images`, then commit `public/images/`.'
            echo 'Review local-minus-manifest entries before deleting them; the script never prunes.'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CHECK_STATUS: ${{ steps.check.outputs.status }}

      - name: Reconcile managed image-mirror issue
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # Passed through the environment, never interpolated into the script body
          # (atlas decision 0142 step 5.4). The script writes issue_outcome on every
          # path after module load. An empty value means nothing was measured: the
          # step never ran (the install failed), crashed at load, or timed out. All
          # of those are failure.
          IMAGE_MIRROR_ISSUE_OUTCOME: ${{ steps.check.outputs.issue_outcome }}
        with:
          script: |
            const {pathToFileURL} = await import('node:url');
            const reconciler = await import(pathToFileURL(`${process.cwd()}/audits/lib/file-check-issues.mjs`).href);
            await reconciler.reconcileCheckIssues({
              checks: [
                {id: 'image-mirror', title: 'Image mirror audit (deploy)', outcome: process.env.IMAGE_MIRROR_ISSUE_OUTCOME || 'failure'},
              ],
              repo: `${context.repo.owner}/${context.repo.repo}`,
              runUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              client: reconciler.createGithubClient(github),
            });
