name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: read # read @j0nathan-ll0yd/* from GitHub Packages during pnpm install

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # --json emits structured (NDJSON) build logs for CI log triage. Scoped to
        # deploy workflows only; local `pnpm build` stays human-readable. pnpm forwards
        # trailing args to the script directly (no `--` separator needed), preserving the
        # prebuild/postbuild lifecycle hooks. Nothing downstream parses the human log format.
        run: pnpm build --json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=human-datastream

      - name: Notify backend of new deploy
        # Lets already-open dashboard tabs pick up the new build in real time via
        # the WebSocket push (backend POST /deploy/notify -> broadcast app-update).
        # Best-effort: the service worker's hourly update check is the guaranteed
        # backstop, so a failure here must never fail the deploy. The sleep gives
        # Cloudflare edge PoPs time to serve the new sw.js before clients re-check.
        # No-op until the DEPLOY_NOTIFY_* secrets are configured.
        continue-on-error: true
        env:
          DEPLOY_NOTIFY_URL: ${{ secrets.DEPLOY_NOTIFY_URL }}
          DEPLOY_NOTIFY_TOKEN: ${{ secrets.DEPLOY_NOTIFY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_NOTIFY_URL" ]; then
            echo "DEPLOY_NOTIFY_URL not set; skipping deploy notification."
            exit 0
          fi
          sleep 30
          # --connect-timeout/--max-time are load-bearing: continue-on-error only
          # swallows a non-zero EXIT, not a HANG. Without a bound, an unresponsive
          # notify backend leaves this curl running until the job timeout (~14 min),
          # which cancels the job and reports the whole deploy as FAILED even though
          # Build + Deploy to Cloudflare Pages already succeeded -- and a red deploy
          # skips the post-deploy smoke check (workflow_run.conclusion != success).
          # Observed on runs 29775663681 (#139) and 29779665862 (#140).
          curl -fsS --connect-timeout 5 --max-time 20 -X POST "$DEPLOY_NOTIFY_URL" \
            -H "Authorization: Bearer $DEPLOY_NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"build\":\"${GITHUB_SHA}\"}"

  check-images:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # fetch-images.mjs imports @j0nathan-ll0yd/portal-contract, so this job needs
      # the dependencies installed. Without it the script dies with
      # ERR_MODULE_NOT_FOUND before it can check anything.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for new images
        id: check
        continue-on-error: true
        run: node scripts/fetch-images.mjs --check-only

      - name: Create issue for new images
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MISSING=$(cat missing-images.txt)
          gh issue create \
            --title "New images detected on CloudFront" \
            --body "$(cat <<EOF
          The deploy detected new images on CloudFront that are not yet committed to the repo.

          **Missing images:**
          \`\`\`
          ${MISSING}
          \`\`\`

          **To fix:**
          \`\`\`bash
          pnpm run fetch:images
          git add public/images/
          git commit -m "Add new optimized images from CloudFront"
          git push
          \`\`\`
          EOF
          )"
