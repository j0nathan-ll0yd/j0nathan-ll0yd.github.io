# Production Smoke Check Workflow
#
# Triggers after the "Deploy to Cloudflare Workers" workflow completes successfully
# on main. Uses GitHub's native workflow_run event -- no PAT, no Cloudflare-side
# configuration. The smoke check loads the deployed site and asserts it actually
# HYDRATED: widget containers present, the live-data runtime cleared its skeleton
# states, the bio terminal typed its content (the #50 regression class), the
# service worker registered, and no CSP / chunk-load / console errors fired.
#
# Replaces the retired pixel-drift workflow. Drift pixel-diffed a frozen baseline
# against a live data stream and could never stay green -- and could not catch a
# hydration failure (a blocked island still renders its SSR shell at the right
# pixels). This check asserts hydration RAN instead.
#
# Runs on the self-hosted runner-playwright image (Chromium preinstalled), on the
# cfedge egress lane -- see the runs-on comment. No SwiftShader/GPU determinism
# flags: it takes no screenshots and needs no cross-OS pixel determinism, so it is
# immune to the QEMU/SwiftShader failure that constrains the visual-regression path.
#
# Also supports manual trigger via workflow_dispatch for testing.
#
# THRESHOLD TIER: INFORMATIONAL (initial bake-in)
#   Non-blocking: a failure opens or updates one managed issue rather than failing
#   CI, and the next passing run closes it. Unlike pixel-drift, smoke failures are
#   high-signal / near-zero false positive (an HTTP error, a CSP-blocked external
#   script, or a dead hydration is never a false positive), so this will not
#   reproduce the ignore-the-noise problem. A gated artifact's focus-suppression
#   answer is not a failure: those tests skip while a focus mode hides the data.
#   Promote to blocking after a bake-in period of confidence.

name: Production Smoke Check

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: read # read @j0nathan-ll0yd/* from GitHub Packages during pnpm install

jobs:
  smoke-check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # playwright label: the runner-playwright image (FROM mcr.microsoft.com/playwright)
    # ships Chromium + system deps preinstalled. The node label cannot `playwright install
    # --with-deps` -- apt-get to ports.ubuntu.com is blocked by the runner's egress isolation.
    # cfedge label: the self-hosted Linux fleet reaches CloudFront only from the cfedge
    # egress lane (ci-runners-private #130, atlas decisions 0085 and 0088). The gated-artifact
    # tests read the backend's focus.json on CloudFront so they can skip while a focus mode
    # hides the data. Without the lane that read always failed and no test ever skipped:
    # issue #201 collected 14 failures from 2026-08-23 to 2026-10-12, and every retained
    # report shows the gated paths answering 503 with `X-Source: cloudfront-proxy-suppressed`,
    # the site working as designed during a Work or Do Not Disturb focus.
    # audits/__tests__/deploy-workflow.test.ts keeps the label.
    runs-on: [self-hosted, linux, arm64, playwright, cfedge]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail before the report-only smoke step when the self-hosted runner cannot reach
      # external hosts. A responding 5xx still passes this transport probe and remains a
      # site/app failure for Playwright to report (issue #186).
      - name: Pre-flight egress probe (runner-egress-down vs site-down)
        run: bash audits/preflight-egress.sh

      # Browsers are PREINSTALLED in the runner-playwright image -- do NOT add
      # `playwright install` (matches visual-tests.yml).
      - name: Run production smoke check
        id: smoke
        # The just-deployed commit; the smoke check asserts the live version.json
        # serves it. Empty on workflow_dispatch -> that assertion self-skips.
        # EXPECTED_BUILT_AFTER is this deploy's start time: a NEWER deploy that
        # superseded this one between deploy and smoke (rapid successive merges)
        # serves a build with builtAt >= this instant and is accepted; a stale
        # older build (builtAt before it) still fails. See home.smoke.ts.
        env:
          EXPECTED_BUILD: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_BUILT_AFTER: ${{ github.event.workflow_run.run_started_at }}
        run: pnpm run test:smoke
        continue-on-error: true

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-playwright-report
          path: playwright-report/
          retention-days: 30

      # ONE managed issue, through the reconciler the audit lanes and the deploy image check
      # use (audits/lib/file-check-issues.mjs): a failed smoke step opens or updates it, a
      # passing run closes it, and a run whose smoke step never ran (an earlier step failed,
      # so the job is already red) leaves it unchanged. The direct issues.create this
      # replaces appended to issue #201 on every failure and never closed it.
      - name: Reconcile managed smoke issue
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # Passed through the environment, never interpolated into the script body (atlas
          # decision 0142 step 5.4). `skipped` is neither success nor failure, so the
          # reconciler leaves the issue as it is; an empty value means nothing ran at all.
          SMOKE_ISSUE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const {pathToFileURL} = await import('node:url');
            const reconciler = await import(pathToFileURL(`${process.cwd()}/audits/lib/file-check-issues.mjs`).href);
            await reconciler.reconcileCheckIssues({
              checks: [
                {id: 'smoke', title: 'Production smoke check (after deploy)', outcome: process.env.SMOKE_ISSUE_OUTCOME || 'failure'},
              ],
              repo: `${context.repo.owner}/${context.repo.repo}`,
              runUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              client: reconciler.createGithubClient(github),
            });
