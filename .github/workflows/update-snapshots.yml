name: Update Snapshots

# Update Snapshots Workflow
#
# PRIMARY: pull_request: types: [labeled] — add label `update-snapshots` to a PR
#   to regenerate visual baselines in Docker and auto-commit back to the PR branch.
#   The workflow self-removes the label after a successful commit.
#
# BREAK-GLASS: workflow_dispatch with pr_number input — for cases where the label
#   trigger fails:
#     1. Cross-fork PRs (workflow cannot push to external forks).
#     2. GITHUB_TOKEN cannot trigger workflows from other workflows — chained
#        workflow triggers may not fire; manual dispatch always works.
#     3. Label-trigger glitches or you want to re-run without removing/re-adding
#        the label.
#   Invoke via:  gh workflow run update-snapshots.yml -f pr_number=NNN

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to remove the label from (optional, only used to clean up the label after commit)'
        required: false
        type: string

permissions:
  contents: write      # required for auto-commit back to PR branch
  pull-requests: write # required to remove the label after commit

# Note: Auto-commit will fail for cross-fork PRs (cannot push to external forks).
# Acceptable for personal repo. Workflow self-disables on cross-fork PRs.

jobs:
  resolve-version:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'update-snapshots' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      pw-version: ${{ steps.extract.outputs.version }}
      target-ref: ${{ steps.target.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - id: target
        run: echo "ref=${{ github.event.pull_request.head.ref || github.ref_name }}" >> $GITHUB_OUTPUT
      - id: extract
        run: echo "version=$(./scripts/playwright-version.sh)" >> $GITHUB_OUTPUT
      - name: Guard - verify Docker image exists
        run: |
          VERSION=$(./scripts/playwright-version.sh)
          docker manifest inspect "mcr.microsoft.com/playwright:v${VERSION}-noble" \
            || (echo "::error::Playwright Docker image v${VERSION}-noble not published yet"; exit 1)

  update:
    needs: resolve-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.resolve-version.outputs.pw-version }}-noble
      # --ipc=host avoids 64MB /dev/shm crashes on tall fullPage screenshots;
      # --shm-size=2g is belt-and-suspenders if ipc isolation overrides apply.
      options: --ipc=host --shm-size=2g
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.target-ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup design-system + install dependencies
        env:
          DS_REF: main
        run: bash scripts/ci-setup.sh
      - name: Update visual baselines
        env:
          USE_FIXTURES: 'true'
        run: npx playwright test --update-snapshots
      - name: Update drift baselines
        env:
          USE_FIXTURES: 'true'
        run: npx playwright test --config=playwright.drift.config.ts --update-snapshots
        continue-on-error: true  # drift target site may be unreachable; non-blocking
      - name: Mark workspace as safe (Docker container uid mismatch)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Commit updated baselines
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: regenerate visual + drift baselines via update-snapshots label"
          file_pattern: 'tests/visual/__screenshots__/** tests/drift/__screenshots__/**'
      - name: Remove update-snapshots label
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || parseInt('${{ inputs.pr_number }}');
            if (!prNumber) return;
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'update-snapshots'
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }
