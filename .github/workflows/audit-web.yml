# Web Audit Synthetics -- lp-audit Phase 2 (monorepo-LifegamesPortal
# .omc/plans/monorepo-audit-system.md, catalog domain B). Scheduled, read-only
# checks against the LIVE site (https://jonathanlloyd.me); this workflow never
# touches site source, CSP, or build behavior.
#
# REPORT-ONLY (D4): every check step below runs `continue-on-error: true`, so
# a failing check never fails the job or blocks anything -- it reconciles one
# machine-owned GitHub issue per check id (D5), including closing it only after
# that check's whole result bucket is green. The job still finishes and pings
# its Healthchecks.io dead-man's-switch (D6). Promotion to blocking is a Phase
# 6 decision, not something this workflow does on its own.
#
# MERGING TO main DEPLOYS THIS WORKFLOW (main auto-deploys to Cloudflare Pages
# AND is the only branch GitHub will fire `schedule:`/`workflow_dispatch` from
# -- registry fact web-main-autodeploys-prod) -- do not merge without explicit
# user instruction (B5). The schedules below only start firing once merged.

name: Web Audit Synthetics

on:
  schedule:
    # Off-round minutes (D6: avoid the 22:00-02:00 UTC GitHub cron congestion
    # window and exact-hour thundering herds).
    - cron: '17 6 * * *' # daily
    - cron: '23 5 * * 1' # weekly (Monday)
    - cron: '41 4 2 * *' # monthly (day 2)
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to run'
        type: choice
        options: [all, daily, weekly, monthly]
        default: all

concurrency:
  group: audit-web
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  packages: read # read @j0nathan-ll0yd/* from GitHub Packages during pnpm install

jobs:
  daily:
    name: Daily (B1 smoke, B6 analytics)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.tier == 'daily' || inputs.tier == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *')
    # playwright label: Chromium is preinstalled in the runner-playwright image; the node
    # label cannot `playwright install --with-deps` (apt-get to ports.ubuntu.com is egress-blocked).
    # cfedge label: COLIMA-CFEDGE egress-lane marker (ci-runners-private #130, stage C2) — routes
    # this job onto the pinned subnet whose source-scoped rule allows CloudFront :443, so page
    # assets keep loading once the shared-bridge CloudFront rule is removed. Admission-neutral;
    # inert until the host flips COLIMA_CFEDGE_LABELS (stage C3).
    runs-on: [self-hosted, linux, arm64, playwright, cfedge]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Distinguish a self-hosted runner egress outage from a real site regression BEFORE
      # the continue-on-error checks run, so an egress outage reds the job with an
      # actionable message instead of masking as a smoke no-op (2026-08-17 incident).
      - name: Pre-flight egress probe (runner-egress-down vs site-down)
        run: bash scripts/audit/preflight-egress.sh

      # Browsers are PREINSTALLED in the runner-playwright image -- do NOT add `playwright install`.
      - name: B1 -- production smoke suite (scheduled, not just post-deploy)
        id: smoke
        continue-on-error: true
        run: pnpm run test:smoke

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-web-daily-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: B6 -- analytics beacons (CF + SA)
        id: analytics
        continue-on-error: true
        env:
          SA_API_KEY: ${{ secrets.SA_API_KEY }}
        run: node scripts/audit/check-analytics.mjs

      - name: Reconcile managed audit issues
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const {pathToFileURL} = await import('node:url');
            const reconciler = await import(pathToFileURL(`${process.cwd()}/scripts/audit/lib/file-check-issues.mjs`).href);
            await reconciler.reconcileCheckIssues({
              checks: [
                {id: 'smoke', title: 'B1 production smoke suite (scheduled)', outcome: '${{ steps.smoke.outcome }}'},
                {id: 'analytics', title: 'B6 analytics beacons (CF + SA)', outcome: '${{ steps.analytics.outcome }}'},
              ],
              repo: `${context.repo.owner}/${context.repo.repo}`,
              runUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              client: reconciler.createGithubClient(github),
            });

      # Plain ping = the lane ran to measurement; $HC_URL/fail = it wedged
      # first. Findings never move job.status (every check is
      # continue-on-error), so they keep pinging success and stay the
      # reconciler's job. See scripts/audit/healthchecks-ping.sh.
      - name: Healthchecks.io ping
        if: always()
        env:
          HC_URL: ${{ secrets.HC_PING_AUDIT_WEB }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/audit/healthchecks-ping.sh

  weekly:
    name: Weekly (B2 artifacts, B3 LHCI, B4 pa11y, B5 lychee, B7 headers, B8 cache)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.tier == 'weekly' || inputs.tier == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '23 5 * * 1')
    # playwright label: Chromium is preinstalled in the runner-playwright image (shared by
    # B3 LHCI / B4 pa11y via the resolved executablePath below); the node label cannot
    # `playwright install --with-deps` (apt-get to ports.ubuntu.com is egress-blocked).
    # cfedge label: COLIMA-CFEDGE egress-lane marker (ci-runners-private #130, stage C2) — keeps
    # CloudFront asset egress for B3/B4 once the shared-bridge rule is source-scoped. Inert until
    # stage C3 flips COLIMA_CFEDGE_LABELS.
    runs-on: [self-hosted, linux, arm64, playwright, cfedge]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Distinguish a self-hosted runner egress outage from a real site regression before
      # the continue-on-error checks run (2026-08-17 incident).
      - name: Pre-flight egress probe (runner-egress-down vs site-down)
        run: bash scripts/audit/preflight-egress.sh

      # NO PACKAGE INSTALL STEP HERE, BY DESIGN. This job used to `apt-get
      # install libxml2-utils` for the xmllint that validate-sitemap.mjs shelled
      # out to. These runners sit behind a default-deny egress allowlist
      # (ci-runners-private) that does not include ports.ubuntu.com or
      # deb.nodesource.com -- the same isolation the two `runs-on` comments above
      # already call out for `playwright install --with-deps`. apt-get exited 100
      # on every attempt and killed the whole report-only job before a single
      # check ran (31999694781, 32600311656, 32695529989 -- 15 days dark).
      # validate-sitemap.mjs now validates in-process via
      # scripts/audit/lib/sitemap-schema.mjs (fast-xml-parser +
      # fast-xml-validator, already in the lockfile), so nothing here needs the
      # network beyond the site under test. Do not reintroduce a per-run install.

      # pa11y-ci (Puppeteer) and @lhci/cli (chrome-launcher) each otherwise
      # download their own Chrome-for-Testing copy. Installing Playwright's
      # chromium once and pointing both at it via the standard env vars they
      # each already support (PUPPETEER_EXECUTABLE_PATH, CHROME_PATH) avoids
      # two redundant ~200MB downloads and the extraction flakiness class hit
      # while developing this workflow (a Puppeteer-downloaded Chrome build
      # whose .zip was missing its nested Frameworks bundle -- unrelated to
      # this repo, but a real local failure mode for this class of tooling).
      # Chromium is PREINSTALLED in the runner-playwright image; resolve its path below
      # (shared by B3 LHCI / B4 pa11y) instead of `playwright install`.
      - name: Resolve shared Chrome path
        id: chrome
        run: |
          PATH_OUT=$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath());")
          echo "path=$PATH_OUT" >> "$GITHUB_OUTPUT"

      - name: Probe focus suppression for conditioned checks
        id: focus_mode
        continue-on-error: true
        run: node scripts/audit/probe-suppression.mjs --github-output

      - name: B2 -- llms.txt structural validator
        id: llms_txt
        if: steps.focus_mode.outputs.suppressed != 'true'
        continue-on-error: true
        run: node scripts/audit/validate-llms-txt.mjs

      - name: B2 -- sitemap XSD validator
        id: sitemap
        continue-on-error: true
        run: node scripts/audit/validate-sitemap.mjs

      - name: B2 -- robots.txt validator
        id: robots
        continue-on-error: true
        run: node scripts/audit/validate-robots.mjs

      - name: B2 -- feed.xml / feed.json validator
        id: feeds
        if: steps.focus_mode.outputs.suppressed != 'true'
        continue-on-error: true
        run: node scripts/audit/check-feeds.mjs

      # ADR 0011 follow-up (b). Re-fetches each rule's PINNED primary source
      # (an immutable RFC .txt or a 40-hex-SHA-pinned raw.githubusercontent
      # blob -- follow-up (a) constrains verification_url to exactly those) and
      # asserts every normative_quote still occurs in it, in order. This is the
      # DRIFT half only; the offline integrity half blocks on every PR in
      # static-checks.yml. It lives here, weekly and report-only, because
      # upstream drift runs on an external clock and depends on two
      # third-party hosts -- blocking merges on their uptime would import it
      # into our merge path. An unreachable source reports INDETERMINATE, which
      # is a finding, never a pass.
      - name: B2 -- external spec drift (pinned sources vs normative quotes)
        id: spec_drift
        continue-on-error: true
        run: node scripts/audit/check-spec-drift.mjs

      - name: B7/B8 -- security headers, TLS/cert expiry, CSP drift
        id: headers
        continue-on-error: true
        run: node scripts/audit/check-headers.mjs

      - name: B3 -- Lighthouse CI (filesystem target)
        id: lhci
        continue-on-error: true
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        # Budgets (perf>=0.90, a11y/seo>=0.95) are v1 starting values (D4
        # report-only) -- ratchet or ship-fix per Phase 6 bake-in, don't silently
        # loosen them.
        #
        # best-practices is the ONE exception, held at 0.90 with an expiry:
        #
        # Measured ceiling. Once B3 could complete at all (#212), best-practices
        # came in at a dead-flat 0.93/0.93/0.93 -- run 32899112390 -- because
        # errors-in-console and inspector-issues each zero out (weight 1 each) on
        # console errors the SITE does not cause. They are ERR_CONNECTION_REFUSED
        # against hosts this runner's egress allowlist denies. A budget above the
        # measured ceiling reds on network policy, which trains readers to ignore
        # the check. 0.90 sits below the ceiling and still catches a real
        # regression.
        #
        # The Amazon half of that ceiling is now CLOSED (atlas decision 0086, W3).
        # It used to read: after the runner-side CloudFront allowlist, the last ~4
        # requests went to m.media-amazon.com for book covers, on a host that
        # sampled onto CloudFront, Akamai AND Fastly, so no address-prefix
        # allowlist could hold it; ci.collect.settings.blockedUrlPatterns blocked
        # them instead. The site no longer requests that host at all -- the backend
        # serves first-party CloudFront image URLs and @j0nathan-ll0yd/web >=3.0.0
        # falls back to the same-origin /images/no-cover.svg, never a third-party
        # host. The blocklist entry has been deleted; it had no purpose left.
        #
        # What still holds the ceiling, measured after the blocklist landed (run
        # 32900059618): errors-in-console was already down to 3 entries with the
        # Amazon requests silenced, all the same WebSocket --
        # wss://iu1k9jv4mi.execute-api.us-west-2.amazonaws.com/live,
        # ERR_CONNECTION_REFUSED. That is API Gateway, which the CloudFront
        # allowlist does not cover. inspector-issues (CSP) is the other zero.
        # Neither is affected by the image work, so the budget STAYS at 0.90 here.
        #
        # REVISIT TRIGGER, reduced to its remaining half: 0.95 needs the wss host
        # reachable from the runner (or otherwise silenced) AND inspector-issues
        # resolved. Both are network-policy items tracked separately, not site
        # defects. Re-measure a real B3 run before ratcheting; do not infer the
        # score from this note.
        #
        # Chrome flags live in .lighthouserc.json, not here:
        # `lhci autorun` takes no chrome-flags argument and the rc file is strict
        # JSON that takes no comments, so this step is the only place the reasoning
        # fits. Two container defects preceded the budget work, in this order:
        #
        # --no-sandbox: these runners are containers whose distro disables
        # unprivileged user namespaces under AppArmor, so Chrome aborted at launch
        # with "No usable sandbox!" and lhci reported the downstream symptom
        # (ECONNREFUSED on the DevTools port) -- run 32890887108. B4 below never hit
        # this because .pa11yci has carried the same flag from the start.
        #
        # --disable-dev-shm-usage: with the launch fixed, Chrome started and
        # navigated, then the page died mid-trace and Lighthouse timed out at 30s
        # with NO_FCP -- run 32891570773. Docker's default /dev/shm is 64MB and
        # Lighthouse's tracing is far heavier on shared memory than pa11y's axe run,
        # which is why B4 loads the same URL in 1.5s on the same binary in the same
        # container. The flag moves shared memory to /tmp.
        #
        # The two configs must keep agreeing; a flag added to one belongs in the
        # other unless the reason is tool-specific, as --disable-dev-shm-usage is.
        run: |
          if [ "${{ steps.focus_mode.outputs.suppressed }}" = "true" ]; then
            echo "CONDITIONED: Lighthouse measured the focus-mode overlay, not the normal dashboard."
            echo "> Lighthouse result is focus-mode-conditioned: ${{ steps.focus_mode.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          pnpm exec lhci autorun --config=.lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-web-weekly-lhci-reports
          path: lhci-reports/
          retention-days: 30

      - name: B4 -- pa11y-ci (axe + htmlcs, live URL + /privacy)
        id: pa11y
        continue-on-error: true
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          if [ "${{ steps.focus_mode.outputs.suppressed }}" = "true" ]; then
            echo "CONDITIONED: pa11y measured the focus-mode overlay on /; /privacy remains unconditioned."
            echo "> pa11y / result is focus-mode-conditioned: ${{ steps.focus_mode.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          pnpm exec pa11y-ci

      - name: Restore lychee link cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-cache-${{ github.run_id }}
          restore-keys: lychee-cache-

      - name: B5 -- lychee link check (live HTML + llms.txt + feed.xml)
        id: lychee
        if: steps.focus_mode.outputs.suppressed != 'true'
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # feed.json is deliberately excluded: lychee has no JSON-aware
          # extractor, so it regex-scans the raw text and mis-includes the
          # surrounding quote characters from JSON string values, producing
          # false-positive "broken link" noise for every URL field. feed.json's
          # own URLs are already validated structurally by check-feeds.mjs.
          args: >-
            --verbose --no-progress --cache --max-cache-age 1d --max-retries 0
            https://jonathanlloyd.me/
            https://jonathanlloyd.me/privacy
            https://jonathanlloyd.me/llms.txt
            https://jonathanlloyd.me/feed.xml
          fail: true
          jobSummary: true

      - name: Reconcile managed audit issues
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const {pathToFileURL} = await import('node:url');
            const reconciler = await import(pathToFileURL(`${process.cwd()}/scripts/audit/lib/file-check-issues.mjs`).href);
            await reconciler.reconcileCheckIssues({
              checks: [
                {id: 'llms-txt', title: 'B2 llms.txt structural validator', outcome: '${{ steps.focus_mode.outcome }}'},
                {id: 'llms-txt', title: 'B2 llms.txt structural validator', outcome: '${{ steps.llms_txt.outcome }}'},
                {id: 'sitemap', title: 'B2 sitemap XSD validator', outcome: '${{ steps.sitemap.outcome }}'},
                {id: 'robots', title: 'B2 robots.txt validator', outcome: '${{ steps.robots.outcome }}'},
                {id: 'feeds', title: 'B2 feed.xml/feed.json validator', outcome: '${{ steps.focus_mode.outcome }}'},
                {id: 'feeds', title: 'B2 feed.xml/feed.json validator', outcome: '${{ steps.feeds.outcome }}'},
                {id: 'spec-drift', title: 'B2 external spec drift (pinned sources vs normative quotes)', outcome: '${{ steps.spec_drift.outcome }}'},
                {id: 'headers', title: 'B7/B8 headers, TLS, CSP drift', outcome: '${{ steps.headers.outcome }}'},
                {id: 'lhci', title: 'B3 Lighthouse CI budgets', outcome: '${{ steps.lhci.outcome }}'},
                {id: 'pa11y', title: 'B4 pa11y-ci accessibility', outcome: '${{ steps.pa11y.outcome }}'},
                {id: 'lychee', title: 'B5 lychee link check', outcome: '${{ steps.focus_mode.outcome }}'},
                {id: 'lychee', title: 'B5 lychee link check', outcome: '${{ steps.lychee.outcome }}'},
              ],
              repo: `${context.repo.owner}/${context.repo.repo}`,
              runUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              client: reconciler.createGithubClient(github),
            });

      # Plain ping = the lane ran to measurement; $HC_URL/fail = it wedged
      # first. Findings never move job.status (every check is
      # continue-on-error), so they keep pinging success and stay the
      # reconciler's job. See scripts/audit/healthchecks-ping.sh.
      - name: Healthchecks.io ping
        if: always()
        env:
          HC_URL: ${{ secrets.HC_PING_AUDIT_WEB }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/audit/healthchecks-ping.sh

  monthly:
    name: Monthly (B2 security.txt + agent-discovery re-verification)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.tier == 'monthly' || inputs.tier == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '41 4 2 * *')
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Distinguish a self-hosted runner egress outage from a real site regression before
      # the continue-on-error checks run (2026-08-17 incident).
      - name: Pre-flight egress probe (runner-egress-down vs site-down)
        run: bash scripts/audit/preflight-egress.sh

      - name: B2 -- security.txt RFC 9116 expiry
        id: security_txt
        continue-on-error: true
        run: node scripts/audit/check-security-txt.mjs

      - name: B2 -- .well-known agent-discovery structural checks
        id: wellknown
        continue-on-error: true
        run: node scripts/audit/check-wellknown.mjs

      - name: Reconcile managed audit issues
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const {pathToFileURL} = await import('node:url');
            const reconciler = await import(pathToFileURL(`${process.cwd()}/scripts/audit/lib/file-check-issues.mjs`).href);
            await reconciler.reconcileCheckIssues({
              checks: [
                {id: 'security-txt', title: 'B2 security.txt RFC 9116 expiry', outcome: '${{ steps.security_txt.outcome }}'},
                {id: 'wellknown', title: 'B2 .well-known agent-discovery checks', outcome: '${{ steps.wellknown.outcome }}'},
              ],
              repo: `${context.repo.owner}/${context.repo.repo}`,
              runUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              client: reconciler.createGithubClient(github),
            });

      # Plain ping = the lane ran to measurement; $HC_URL/fail = it wedged
      # first. Findings never move job.status (every check is
      # continue-on-error), so they keep pinging success and stay the
      # reconciler's job. See scripts/audit/healthchecks-ping.sh.
      - name: Healthchecks.io ping
        if: always()
        env:
          HC_URL: ${{ secrets.HC_PING_AUDIT_WEB }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/audit/healthchecks-ping.sh
