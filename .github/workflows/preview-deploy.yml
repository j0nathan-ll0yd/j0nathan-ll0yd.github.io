name: Preview Deploy (PR)

on:
  pull_request:
    branches: [main]

# Cancel superseded runs for the same PR to avoid queuing stale deploys.
concurrency:
  group: preview-deploy-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read # read @j0nathan-ll0yd/config from GitHub Packages during ci-setup.sh's npm ci

jobs:
  preview:
    # Same runner class as deploy.yml.
    runs-on: [self-hosted, linux, arm64, node]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup design-system + install dependencies
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-setup.sh

      - name: Build
        # --json emits structured (NDJSON) build logs for CI log triage. Scoped to
        # deploy workflows only; local `npm run build` stays human-readable. The `--`
        # forwards the flag to `astro build` while preserving the prebuild/postbuild
        # lifecycle hooks. Nothing downstream parses the human log format.
        run: npm run build -- --json

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=human-datastream --branch=${{ github.head_ref }}

      - name: Echo preview URL
        run: echo "Preview deployed to ${{ steps.deploy.outputs.deployment-url }}"
