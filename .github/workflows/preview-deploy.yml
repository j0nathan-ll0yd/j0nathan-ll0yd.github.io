name: Preview Deploy (PR)

on:
  pull_request:
    branches: [main]

# Cancel superseded runs for the same PR to avoid queuing stale deploys.
concurrency:
  group: preview-deploy-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Run on the same runner class as deploy.yml.
    # TEMP (2026-06-24): self-hosted fleet down; using GitHub-hosted.
    # REVERT to [self-hosted, linux, arm64, node] once recovered.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup design-system + install dependencies
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
        run: bash scripts/ci-setup.sh

      - name: Build
        run: npm run build

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=human-datastream --branch=${{ github.head_ref }}

      - name: Echo preview URL
        run: echo "Preview deployed to ${{ steps.deploy.outputs.deployment-url }}"
