name: Preview Deploy (PR)

on:
  pull_request:
    branches: [main]

# Cancel superseded runs for the same PR to avoid queuing stale deploys.
concurrency:
  group: preview-deploy-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read # read @j0nathan-ll0yd/* from GitHub Packages during pnpm install

jobs:
  preview:
    # Same runner class as deploy.yml.
    runs-on: [self-hosted, linux, arm64, node]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # --json emits structured (NDJSON) build logs for CI log triage. Scoped to
        # deploy workflows only; local `pnpm build` stays human-readable. pnpm forwards
        # trailing args to the script directly (no `--` separator needed), preserving the
        # prebuild/postbuild lifecycle hooks. Nothing downstream parses the human log format.
        run: pnpm build --json

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=human-datastream --branch=${{ github.head_ref }}

      - name: Echo preview URL
        run: echo "Preview deployed to ${{ steps.deploy.outputs.deployment-url }}"
