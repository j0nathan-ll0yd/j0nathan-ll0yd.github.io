name: Preview Version (PR)

on:
  pull_request:
    branches: [main]

# Cancel superseded runs for the same PR to avoid queuing stale version uploads.
concurrency:
  group: preview-deploy-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read # read @j0nathan-ll0yd/* from GitHub Packages during pnpm install

jobs:
  preview:
    # Same runner class as deploy.yml. No cfedge: nothing here reads CloudFront from the
    # runner; the Worker reads it from Cloudflare's edge.
    runs-on: [self-hosted, linux, arm64, node]
    # GitHub gives Dependabot-triggered and fork runs no Actions secrets. Gate the
    # upload and the Access check on the token itself, not the actor name, so the
    # build still runs for every actor and only the Cloudflare steps are skipped.
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # --json emits structured (NDJSON) build logs for CI log triage. Scoped to
        # deploy workflows only; local `pnpm build` stays human-readable. pnpm forwards
        # trailing args to the script directly (no `--` separator needed), preserving the
        # prebuild/postbuild lifecycle hooks. Nothing downstream parses the human log format.
        run: pnpm build --json
        env:
          # The preview's fixture data plane reads tests/fixtures/composed at this commit
          # (src/lib/data-plane/faults.ts FIXTURE_REF), so the fixture matches the Worker.
          SSR_FIXTURE_REF: ${{ github.event.pull_request.head.sha }}

      - name: Note skipped preview upload
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "Preview version upload skipped because the run has no CLOUDFLARE_API_TOKEN (GitHub gives Dependabot-triggered runs no Actions secrets)." >> "$GITHUB_STEP_SUMMARY"

      - name: Probe the deploy token's capabilities (read-only)
        # Decision 0160 Step 3.7: after the cutover, deploy.yml deploys the production route, which
        # needs Zone read and Workers Routes on jonathanlloyd.me in addition to Workers Scripts. One GET
        # per capability; prints only HTTP status codes (scripts/check-deploy-token.mjs). Report only.
        if: env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/check-deploy-token.mjs

      - name: Upload a Worker version
        id: upload
        if: env.HAS_CF_TOKEN == 'true'
        # atlas decision 0160, PR A (plan Step 3.5). `wrangler versions upload` creates a new
        # version of the Worker WITHOUT deploying it: production keeps serving the active
        # deployment. The version gets a Version URL, and the PR a stable alias URL
        # (pr-<number>-human-datastream.<subdomain>.workers.dev), only while preview_urls is
        # true. Cloudflare Access guards both (decision 0160 D1, gate G3, done 2026-10-14). Wrangler writes the URLs to its ND-JSON output file; the step reads them
        # from there, not from the human log.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          # SSR_FAULT_INJECTION: the Step 6.10 fault header (src/lib/data-plane/faults.ts), honored
          # only on *.workers.dev hosts, which Access guards. deploy.yml refuses the variable.
          pnpm exec wrangler versions upload --preview-alias "$PREVIEW_ALIAS" --var SSR_FAULT_INJECTION:1 --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA}"
          node --input-type=module -e '
            import {appendFileSync, readFileSync} from "node:fs"
            const entries = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").trim().split("\n").map((line) => JSON.parse(line))
            const upload = entries.find((entry) => entry.type === "version-upload")
            if (!upload) {
              console.error("wrangler wrote no version-upload entry")
              process.exit(1)
            }
            const out = [`version_id=${upload.version_id}`, `preview_url=${upload.preview_url ?? ""}`, `alias_url=${upload.preview_alias_url ?? ""}`]
            appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n")
            console.log(out.join("\n"))
          '

      - name: Check that Cloudflare Access guards the Version URLs
        id: access
        if: env.HAS_CF_TOKEN == 'true'
        # Pass: an anonymous GET does not answer 200, a GET with the CI service token does, and it
        # carries X-Site-Runtime: workers (scripts/check-preview-access.mjs). A host that answers
        # wrongly fails the step. A host the runner cannot reach is UNMEASURED: a ::warning and a
        # step-summary verdict naming host, addresses and error, never a pass. The runner egress
        # stays closed to *.workers.dev by owner decision (decision 0160, 2026-10-14), so CI is
        # UNMEASURED on every PR and the tokened checks run locally. With preview_urls
        # false the upload returns no URL and there is nothing to check; with it true (since gate
        # G3), a missing URL is a failure.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
        run: |
          previews=$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("dist/server/wrangler.json","utf8"));process.stdout.write(String(c.preview_urls===true))')
          if [ -z "$PREVIEW_URL" ]; then
            if [ "$previews" = "true" ]; then
              echo "::error::preview_urls is true, but the upload returned no Version URL"
              exit 1
            fi
            echo "::notice::preview_urls is false: version ${{ steps.upload.outputs.version_id }} has no URL to check"
            exit 0
          fi
          node scripts/check-preview-access.mjs --unmeasured-ok "$PREVIEW_URL" ${ALIAS_URL:+"$ALIAS_URL"}
          echo "Version URL: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Alias URL: $ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"
