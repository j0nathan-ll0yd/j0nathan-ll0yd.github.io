name: Static Checks

# Type-safety + lint gates (Wave 2: adopt @j0nathan-ll0yd/config), plus the B2
# spec/eval pilot's derived-eval gates (decisions/0011, DR3):
#   - typecheck: `astro check` against the estate tsconfig floor
#     (astro/tsconfigs/strict + @j0nathan-ll0yd/config/tsconfig-base.json).
#   - lint: `eslint .` with the estate flat-config standard (type-aware).
#   - spec-cases: `pnpm run test:unit` -- the same suite that already ran on
#     the self-hosted `visual-tests.yml:172` PR-only lane, now ALSO on this
#     GitHub-hosted lane covering both `pull_request` and `push: main`
#     (independent of the self-hosted fleet's liveness -- B15, decision 0009).
#   - spec-severity-ratchet: `node scripts/audit/check-spec-severity.mjs` --
#     the monotonic severity ratchet + deletion assertion + params_pending
#     ratchet over scripts/audit/specs/**/*.rule.json.
#   - spec-verification: `node scripts/audit/check-spec-verification.mjs` --
#     ADR 0011 follow-up (a): every rule_class: conformance rule must carry
#     spec.verified_against_source: true against an immutable/pinned source, the
#     mechanism that stops the 7-of-7 citation-defect class from recurring.
#   - spec-quote-integrity: `node scripts/audit/check-spec-drift.mjs
#     --integrity-only` -- ADR 0011 follow-up (b), offline half: every
#     spec.content_sha256 must still equal sha256(spec.normative_quote), so a
#     quote edited after authoring cannot ship green. Deliberately offline; the
#     network half (re-fetching each pinned primary source) runs weekly and
#     report-only in audit-web.yml so third-party uptime never gates a merge.
#   - spec-mutation-score: `pnpm exec stryker run` -- the sufficiency claim (§2 DR2)
#     over the three pure pilot functions (validateSecurityTxt, validateLlmsTxt,
#     validateFeedJson).
#
# All six need the @j0nathan-ll0yd/* packages resolved (src and
# scripts/audit/**/*.mjs both import them). Those packages are published to
# GitHub Packages, so `pnpm install --frozen-lockfile` resolves them once the
# registry read is authenticated: `packages: read` + the built-in Actions token,
# written to the runner's user-level npmrc by each job's "Authenticate to GitHub
# Packages" step (pnpm does not expand ${GITHUB_TOKEN} from the committed .npmrc
# -- atlas decision 0032).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (astro check)
        run: pnpm run typecheck

  lint:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Astro's content-collection types (.astro/*.d.ts) so type-aware
      # ESLint can resolve `astro:content` in src/content.config.ts. astro check
      # syncs on its own; eslint does not, so sync explicitly here.
      - name: Astro sync
        run: pnpm exec astro sync

      - name: Lint (eslint)
        run: pnpm run lint

  spec-cases:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Includes tests/audit/spec-cases.test.ts (decisions/0011): every case
      # declared in scripts/audit/specs/**/*.rule.json is read out of the
      # catalog and asserted against its validator here, on every PR and on
      # push: main -- not only on the self-hosted visual-tests.yml PR lane.
      - name: Unit + spec-cases tests (vitest)
        run: pnpm run test:unit

  spec-severity-ratchet:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-spec-severity.mjs diffs scripts/audit/specs/severity-baseline.json
          # against `git show origin/main:...` -- a shallow (fetch-depth: 1)
          # checkout would not have origin/main reachable on a pull_request
          # event. Full history is cheap for a repo this size.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Monotonic severity ratchet + deletion assertion (REVERSAL 1) +
      # params_pending ratchet (N6) over scripts/audit/specs/**/*.rule.json
      # (decisions/0011). No `tee`, no `|| true` -- a non-zero exit here MUST
      # fail the job (S3 no-op-gate hazard).
      - name: Spec severity ratchet
        run: node scripts/audit/check-spec-severity.mjs

  spec-verification:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0011 follow-up (a): a rule_class: conformance rule may not ship
      # unless its normative_quote is verified against an immutable/pinned
      # source (spec.verified_against_source: true). Reads the rule files raw
      # (not via ajv) so a violation is a clean message, and asserts the
      # immutable/pinned verification_url shape (follow-up (b)). No `|| true` --
      # a non-zero exit MUST fail the job (S3 no-op-gate hazard).
      - name: Spec source-verification gate
        run: node scripts/audit/check-spec-verification.mjs

  spec-quote-integrity:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0011 follow-up (b), OFFLINE half: spec.content_sha256 must still
      # equal sha256(spec.normative_quote). Nothing checked this before --
      # hash-normative-quotes.mjs is a WRITER that rewrites the field to match
      # whatever the quote now says, so editing a quote and re-running it
      # produced a green, self-consistent, silently-altered citation.
      #
      # `--integrity-only` keeps this job OFF the network deliberately: the
      # drift half re-fetches third-party sources and runs weekly in
      # audit-web.yml, so their uptime never gates a merge here. No `|| true`
      # -- a non-zero exit MUST fail the job (S3 no-op-gate hazard).
      - name: Spec quote-integrity gate
        run: node scripts/audit/check-spec-drift.mjs --integrity-only

  spec-mutation-score:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stryker mutation score over the three pure pilot functions only
      # (stryker.conf.json `mutate` + `// Stryker disable all` brackets around
      # everything else in those three files). thresholds.break in
      # stryker.conf.json is the measured floor (decisions/0011, UD1) --
      # `stryker run` itself exits non-zero below it, no `|| true`.
      - name: Mutation score (stryker)
        run: pnpm exec stryker run
