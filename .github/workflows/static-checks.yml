name: Static Checks

# Hosted static gates for type/lint, rule cases and ratchets, source verification and quote
# integrity, mutation score, and OpenSpec covers. The network half of source drift remains weekly
# so third-party uptime cannot block merges. Covers is dependency-free; jobs that import internal
# packages authenticate GitHub Packages through the runner's user npmrc because pnpm does not
# expand GITHUB_TOKEN from the committed project config.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (astro check)
        run: pnpm run typecheck

  lint:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Astro's content-collection types (.astro/*.d.ts) so type-aware
      # ESLint can resolve `astro:content` in src/content.config.ts. astro check
      # syncs on its own; eslint does not, so sync explicitly here.
      - name: Astro sync
        run: pnpm exec astro sync

      - name: Lint (eslint)
        run: pnpm run lint

  spec-cases:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Includes tests/audit/spec-cases.test.ts (decisions/0011): every case
      # declared in scripts/audit/specs/**/*.rule.json is read out of the
      # catalog and asserted against its validator here, on every PR and on
      # push: main -- not only on the self-hosted visual-tests.yml PR lane.
      - name: Unit + spec-cases tests (vitest)
        run: pnpm run test:unit

  spec-severity-ratchet:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-spec-severity.mjs diffs scripts/audit/specs/severity-baseline.json
          # against `git show origin/main:...` -- a shallow (fetch-depth: 1)
          # checkout would not have origin/main reachable on a pull_request
          # event. Full history is cheap for a repo this size.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Monotonic severity ratchet + deletion assertion (REVERSAL 1) +
      # params_pending ratchet (N6) over scripts/audit/specs/**/*.rule.json
      # (decisions/0011). No `tee`, no `|| true` -- a non-zero exit here MUST
      # fail the job (S3 no-op-gate hazard).
      - name: Spec severity ratchet
        run: node scripts/audit/check-spec-severity.mjs

  spec-verification:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0011 follow-up (a): a rule_class: conformance rule may not ship
      # unless its normative_quote is verified against an immutable/pinned
      # source (spec.verified_against_source: true). Reads the rule files raw
      # (not via ajv) so a violation is a clean message, and asserts the
      # immutable/pinned verification_url shape (follow-up (b)). No `|| true` --
      # a non-zero exit MUST fail the job (S3 no-op-gate hazard).
      - name: Spec source-verification gate
        run: node scripts/audit/check-spec-verification.mjs

  spec-quote-integrity:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0011 follow-up (b), OFFLINE half: spec.content_sha256 must still
      # equal sha256(spec.normative_quote). Nothing checked this before --
      # hash-normative-quotes.mjs is a WRITER that rewrites the field to match
      # whatever the quote now says, so editing a quote and re-running it
      # produced a green, self-consistent, silently-altered citation.
      #
      # `--integrity-only` keeps this job OFF the network deliberately: the
      # drift half re-fetches third-party sources and runs weekly in
      # audit-web.yml, so their uptime never gates a merge here. No `|| true`
      # -- a non-zero exit MUST fail the job (S3 no-op-gate hazard).
      - name: Spec quote-integrity gate
        run: node scripts/audit/check-spec-drift.mjs --integrity-only

  spec-mutation-score:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stryker mutation score over the four catalog-backed pure validators
      # (stryker.conf.json `mutate` + `// Stryker disable all` brackets around
      # network-path plumbing in those files). thresholds.break in
      # stryker.conf.json is the measured floor (decisions/0011, UD1) --
      # `stryker run` itself exits non-zero below it, no `|| true`.
      - name: Mutation score (stryker)
        run: pnpm exec stryker run

  covers-conformance:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # openspec-covers gate (atlas decision 0072, finding M6). The wrapper
      # verifies the vendored contract's sha256 pin, then checks every
      # openspec requirement <-> covers: tether both ways. Node builtins only:
      # no pnpm install, no GitHub Packages auth, so a registry outage never
      # gates this job. No `|| true` -- a non-zero exit MUST fail the job
      # (S3 no-op-gate hazard). Same invocation as `pnpm run check:covers`.
      - name: Covers conformance (openspec-covers, blocking)
        run: node scripts/openspec-covers.mjs --blocking
