name: Format

# Blocking format gate (dprint). dprint.json now `extends` the shared
# @j0nathan-ll0yd/config base from node_modules, so the check must run against an
# installed dependency tree -- the standalone dprint/check action cannot resolve a
# package `extends`. We install with `npm ci --legacy-peer-deps` and run
# `npm run format:check`. The @j0nathan-ll0yd scope lives on GitHub Packages; the
# built-in Actions token authenticates it via `packages: read` (the committed
# .npmrc expands ${GITHUB_TOKEN}). Local: `npm run format`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --legacy-peer-deps

      - name: dprint check
        run: npm run format:check
