name: Format

# Blocking format gate (dprint). dprint.json now `extends` the shared
# @j0nathan-ll0yd/config base from node_modules, so the check must run against an
# installed dependency tree -- the standalone dprint/check action cannot resolve a
# package `extends`. We install with `pnpm install --frozen-lockfile` and run
# `pnpm run format:check`. The @j0nathan-ll0yd scope lives on GitHub Packages; the
# built-in Actions token authenticates it via `packages: read`, wired in with the
# "Authenticate to GitHub Packages" step below (pnpm does not expand ${GITHUB_TOKEN}
# from the committed .npmrc -- atlas decision 0032). Local: `pnpm run format`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  format-check:
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # pnpm does NOT expand ${GITHUB_TOKEN} from the committed project .npmrc the way
      # npm did (atlas decision 0032 removed that line), so the token is written to the
      # runner's user-level npmrc here. Without this step the @j0nathan-ll0yd/* install 401s.
      - name: Authenticate to GitHub Packages
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: dprint check
        run: pnpm run format:check
