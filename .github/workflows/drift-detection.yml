# Drift Detection Workflow
#
# Triggers after the "Deploy to Cloudflare Pages" workflow completes successfully
# on main. Uses GitHub's native workflow_run event -- no PAT, no Cloudflare-side
# configuration, no relay needed. The drift check screenshots the deployed site and
# compares against committed drift baselines.
#
# Also supports manual trigger via workflow_dispatch for testing.
#
# THRESHOLD TIER: INFORMATIONAL
#   This workflow is non-blocking. Failure files a GitHub issue rather than failing
#   CI. Pixel tolerance is intentionally looser (5%) than regression tests (2.5%)
#   to reduce false positives from minor rendering differences between production
#   and test environments.

name: Drift Detection

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-detection:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install OS deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run drift detection tests
        id: drift-tests
        run: npx playwright test --config=playwright.drift.config.ts
        continue-on-error: true

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: File issue on drift detected
        if: steps.drift-tests.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Visual drift detected on production deploy';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-detected',
              per_page: 100,
            });
            const dup = existing.data.find((i) => i.title === title);
            if (dup) {
              core.info(`Open drift issue already exists (#${dup.number}); appending run link instead of creating a duplicate.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another drift run detected differences: [View workflow run](${runUrl})`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['visual-drift', 'drift-detected', 'automated'],
              assignees: ['j0nathan-ll0yd'],
              body: [
                '## Visual Drift Detected',
                '',
                'The drift detection workflow found visual differences between the production site and committed baselines.',
                '',
                `**Triggered by:** \`${context.eventName}\``,
                `**Run:** [View workflow run](${runUrl})`,
                '',
                '### Next Steps',
                '1. Review the uploaded `drift-playwright-report` artifact in the workflow run above',
                '2. If the drift is intentional, regenerate baselines: `npx playwright test --config=playwright.drift.config.ts --update-snapshots`',
                '3. Commit the updated baselines to dismiss this issue',
                '4. If unintentional, investigate and revert the production deploy',
              ].join('\n'),
            });
