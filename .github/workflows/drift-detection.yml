# Drift Detection Workflow
#
# Triggers on Cloudflare Pages deploy via repository_dispatch event (type: pages-deployed).
# Also supports manual trigger via workflow_dispatch for testing.
#
# CLOUDFLARE DEPLOY HOOK SETUP:
#   1. In Cloudflare dashboard → Pages → your project → Settings → Deploy hooks
#   2. Create a new deploy hook (or use existing) to capture deploy events
#   3. Create a GitHub Actions incoming webhook that fires repository_dispatch:
#      - In Cloudflare Pages, go to Settings → Notifications → Add notification
#      - Event type: "Deployment successful"
#      - Delivery: Outgoing webhook → URL: https://api.github.com/repos/j0nathan-ll0yd/j0nathan-ll0yd.github.io/dispatches
#      - Payload must include: {"event_type": "pages-deployed"}
#      - Include a GitHub Personal Access Token (PAT) with `repo` scope as Authorization header
#   4. Alternatively, use a Cloudflare Worker triggered on deploy to call the GitHub API
#
# THRESHOLD TIER: INFORMATIONAL
#   This workflow is non-blocking. Failure files a GitHub issue rather than failing CI.
#   Pixel tolerance is intentionally looser (5%) than regression tests (2.5%) to reduce
#   false positives from minor rendering differences between production and test environments.

name: Drift Detection

on:
  repository_dispatch:
    types: [pages-deployed]
  workflow_dispatch:

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install OS deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run drift detection tests
        id: drift-tests
        run: npx playwright test --config=playwright.drift.config.ts
        continue-on-error: true

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: File issue on drift detected
        if: steps.drift-tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Visual drift detected on production deploy',
              labels: ['visual-drift', 'automated'],
              body: [
                '## Visual Drift Detected',
                '',
                'The drift detection workflow found visual differences between the production site and committed baselines.',
                '',
                `**Triggered by:** \`${context.eventName}\``,
                `**Run:** [View workflow run](${runUrl})`,
                '',
                '### Next Steps',
                '1. Review the uploaded `drift-playwright-report` artifact in the workflow run above',
                '2. If the drift is intentional, regenerate baselines: `npx playwright test --config=playwright.drift.config.ts --update-snapshots`',
                '3. Commit the updated baselines to dismiss this issue',
                '4. If unintentional, investigate and revert the production deploy',
              ].join('\n'),
            });
