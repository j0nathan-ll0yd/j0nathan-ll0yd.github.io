name: Visual Regression Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate baselines with --update-snapshots and auto-commit back to the branch'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # required for the baseline auto-commit job (no-op when update_snapshots is false)

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      pw-version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Playwright version
        id: extract
        run: |
          VERSION=$(./scripts/playwright-version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard — verify Docker image is published
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          if ! docker manifest inspect "mcr.microsoft.com/playwright:v${VERSION}-noble" > /dev/null 2>&1; then
            echo "::error::Playwright Docker image v${VERSION}-noble not published yet -- wait or pin version"
            exit 1
          fi

  contract-check:
    name: Schema Contract Check
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-contract-check')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup design-system for yalc schemas
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
        run: bash scripts/ci-setup.sh

      - name: Verify schema contract
        run: node scripts/verify-contract.mjs

      # Tier 2 (Plan #11): catch hand-edits to .contract-lock.json that slipped
      # past the local pre-commit hook (e.g. `--no-verify`, or a clone without
      # Husky installed). Deterministic: compares the regenerated lock against the
      # committed one, excluding only the volatile generatedAt/sha, so it never
      # false-positives.
      - name: Verify .contract-lock.json is not hand-edited
        run: |
          node scripts/check-contract-lock.mjs || {
            echo "::error::.contract-lock.json was hand-edited or is stale."
            echo "::error::Run: node scripts/generate-contract-lock.mjs && git add .contract-lock.json"
            exit 1
          }

  setup:
    needs: resolve-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.resolve-version.outputs.pw-version }}-noble
      # --ipc=host avoids 64MB /dev/shm crashes on tall fullPage screenshots;
      # --shm-size=2g is belt-and-suspenders if ipc isolation overrides apply.
      options: --ipc=host --shm-size=2g
    outputs:
      ds-sha: ${{ steps.ds-info.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve DS ref + SHA for cache key
        id: ds-info
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # For cross-repo coordinated PRs, prefer a same-named branch on design-system
          # if it exists; otherwise fall back to main. This lets a dashboard PR that
          # imports a not-yet-merged DS widget verify against the matching DS branch.
          DS_REPO_URL=https://github.com/j0nathan-ll0yd/design-system-Lifegames.git
          if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "main" ]; then
            CANDIDATE_SHA=$(git ls-remote "$DS_REPO_URL" "refs/heads/$HEAD_REF" | cut -f1)
          else
            CANDIDATE_SHA=""
          fi
          if [ -n "$CANDIDATE_SHA" ]; then
            DS_REF="$HEAD_REF"
            DS_SHA="$CANDIDATE_SHA"
            echo "Using matching DS branch: $DS_REF ($DS_SHA)"
          else
            DS_REF="main"
            DS_SHA=$(git ls-remote "$DS_REPO_URL" refs/heads/main | cut -f1)
            echo "No matching DS branch for '$HEAD_REF'; falling back to main ($DS_SHA)"
          fi
          echo "ref=$DS_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$DS_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore DS+dist cache
        uses: actions/cache@v5
        id: ds-cache
        with:
          path: |
            .yalc
            yalc.lock
            dist
          key: ds-dist-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/ci-setup.sh', 'test/fixtures/build-data/*.json') }}-ds-${{ steps.ds-info.outputs.sha }}

      - name: Setup design-system + install dependencies
        if: steps.ds-cache.outputs.cache-hit != 'true'
        env:
          DS_REF: ${{ steps.ds-info.outputs.ref }}
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
        run: bash scripts/ci-setup.sh

      - name: Build Astro site
        if: steps.ds-cache.outputs.cache-hit != 'true'
        env:
          USE_FIXTURES: 'true'
        run: npm run build

      - name: Upload DS+dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: visual-tests-ds-dist
          path: |
            .yalc
            yalc.lock
            dist
          retention-days: 1
          include-hidden-files: true

  visual-tests:
    needs: [resolve-version, setup]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.resolve-version.outputs.pw-version }}-noble
      # --ipc=host avoids 64MB /dev/shm crashes on tall fullPage screenshots;
      # --shm-size=2g is belt-and-suspenders if ipc isolation overrides apply.
      options: --ipc=host --shm-size=2g
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Download DS+dist artifact
        uses: actions/download-artifact@v8
        with:
          name: visual-tests-ds-dist

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run visual regression tests
        env:
          SKIP_BUILD: 'true'
        # In update_snapshots mode, force workers=1 to eliminate the within-shard
        # write-race that produces truncated PNGs (microsoft/playwright#9760).
        # Validation mode keeps the default 50% workers for speed.
        run: npx playwright test --shard=${{ matrix.shard }}/4 ${{ inputs.update_snapshots && '--update-snapshots --workers=1' || '' }}

      - name: Upload regenerated baselines
        if: ${{ inputs.update_snapshots && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-baselines-shard-${{ matrix.shard }}
          path: tests/visual/__screenshots__/
          retention-days: 1
          include-hidden-files: true

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  commit-baselines:
    if: ${{ inputs.update_snapshots && !cancelled() }}
    runs-on: ubuntu-latest
    needs: visual-tests
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all regenerated baselines
        uses: actions/download-artifact@v8
        with:
          path: tests/visual/__screenshots__/
          pattern: regenerated-baselines-shard-*
          merge-multiple: true
      - name: Commit regenerated baselines
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: regenerate visual baselines via workflow_dispatch"
          file_pattern: 'tests/visual/__screenshots__/**'

  merge-reports:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: visual-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (Playwright CLI only)
        run: npm ci --legacy-peer-deps
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
