name: Visual Regression Tests

# Self-hosted arm64 architecture (replaces the previous amd64 GitHub-hosted runner).
#
# Why dispatch:
# This repo is PUBLIC. Self-hosted runners cannot be registered against a
# public repo without exposing them to fork-PR code execution. Instead, the
# self-hosted runners are registered against the PRIVATE companion repo
# `j0nathan-ll0yd/ci-runners-private`, and the reusable workflow there
# (`web-visual-tests.yml`) is the only thing public-repo workflows call.
# See `ci-runners-private/RUNNERS.md` -> "Companion Repo Pattern".
#
# Schema Contract Check stays GitHub-hosted because it doesn't need the
# playwright image or self-hosted parity -- it's a cheap network-only check.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate baselines on the self-hosted runner and auto-commit back to the branch'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract-check:
    name: Schema Contract Check
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-contract-check')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup design-system for yalc schemas
        env:
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
        run: bash scripts/ci-setup.sh

      - name: Verify schema contract
        run: node scripts/verify-contract.mjs

      # Tier 2 (Plan #11): catch hand-edits to .contract-lock.json that slipped
      # past the local pre-commit hook (e.g. `--no-verify`, or a clone without
      # Husky installed). Deterministic: compares the regenerated lock against the
      # committed one, excluding only the volatile generatedAt/sha, so it never
      # false-positives.
      - name: Verify .contract-lock.json is not hand-edited
        run: |
          node scripts/check-contract-lock.mjs || {
            echo "::error::.contract-lock.json was hand-edited or is stale."
            echo "::error::Run: node scripts/generate-contract-lock.mjs && git add .contract-lock.json"
            exit 1
          }

  visual:
    name: Visual Regression (self-hosted arm64)
    uses: j0nathan-ll0yd/ci-runners-private/.github/workflows/web-visual-tests.yml@main
    permissions:
      contents: write  # required when update_snapshots=true so the companion workflow can commit baselines
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Branch name (not SHA) so the companion workflow can resolve same-named
      # branches on the producer repos for cross-repo coordinated PRs.
      head_branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
      update_snapshots: ${{ inputs.update_snapshots || false }}
    secrets:
      LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
