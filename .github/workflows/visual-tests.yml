name: Visual Regression Tests

# Self-hosted arm64 architecture (replaces the previous amd64 GitHub-hosted runner).
#
# Jobs run DIRECTLY on the self-hosted fleet with the `playwright` label. The
# runner orchestrator (ci-runners-private) polls this repo's queued jobs and
# JIT-registers an ephemeral Apple Container micro-VM per job, built FROM
# mcr.microsoft.com/playwright:v<version>-noble. NOTE: the "companion repo
# workflow_call" pattern documented in early RUNNERS.md drafts is impossible
# here -- GitHub does not allow a public repo to call a reusable workflow that
# lives in a private repo ("workflow was not found"). Fork-PR exposure is
# mitigated the same way as the other public repos on this fleet (DS,
# mantle-OMD): ephemeral single-job micro-VMs with their own kernel, no
# secrets for fork PRs, and GitHub's first-time-contributor approval gate.
#
# Parity guarantee: scripts/run-in-docker.sh pulls the exact same Playwright
# image this runner is built FROM. PNG bytes from a passing pre-push run will
# match CI.
#
# Schema Contract Check stays GitHub-hosted because it doesn't need the
# playwright image or self-hosted parity -- it's a cheap network-only check.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate baselines on the self-hosted runner and auto-commit back to the branch. Forces workers=1 to avoid intra-shard write races (microsoft/playwright#9760).'
        required: false
        default: false
        type: boolean

concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}-${{ inputs.update_snapshots || false }}
  cancel-in-progress: ${{ !(inputs.update_snapshots || false) }}

permissions:
  contents: read

jobs:
  contract-check:
    name: Schema Contract Check
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-contract-check')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Resolve producer refs for parity with current branch
        id: producers
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
        run: |
          # Prefer same-named branches on the producer repos (cross-repo
          # coordinated PRs); otherwise fall back to main. Mirrors the setup job
          # so the contract gate resolves the SAME producer state (e.g. a new
          # @lifegames/fixtures package that only exists on the coordinated branch).
          DS_REPO_URL=https://github.com/j0nathan-ll0yd/design-system-Lifegames.git
          LP_REPO_URL="https://x-access-token:${LP_REPO_TOKEN}@github.com/j0nathan-ll0yd/mantle-LifegamesPortal.git"
          lsr() { git -c "http.https://github.com/.extraheader=" ls-remote "$@" | cut -f1; }
          resolve_ref() {
            local repo_url="$1" out_prefix="$2" candidate_sha=""
            if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "main" ]; then
              candidate_sha=$(lsr "$repo_url" "refs/heads/$HEAD_REF")
            fi
            if [ -n "$candidate_sha" ]; then
              echo "[$out_prefix] using matching branch: $HEAD_REF ($candidate_sha)"
              echo "${out_prefix}_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            else
              local main_sha
              main_sha=$(lsr "$repo_url" refs/heads/main)
              if [ -z "$main_sha" ]; then
                echo "::error::[$out_prefix] could not resolve ANY ref (branch '$HEAD_REF' or main) — auth or connectivity problem, refusing to build against an unknown producer state"
                exit 1
              fi
              echo "[$out_prefix] no matching branch for '$HEAD_REF'; falling back to main ($main_sha)"
              echo "${out_prefix}_ref=main" >> "$GITHUB_OUTPUT"
            fi
          }
          resolve_ref "$DS_REPO_URL" ds
          resolve_ref "$LP_REPO_URL" lp

      - name: Setup design-system for yalc schemas
        env:
          DS_REF: ${{ steps.producers.outputs.ds_ref }}
          LP_REF: ${{ steps.producers.outputs.lp_ref }}
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
        run: bash scripts/ci-setup.sh

      # Tier 2 (Plan #11): the single contract gate. Recomputes the expected lock
      # from the current yalc-linked schemas and compares every checksum, so it
      # catches BOTH upstream schema drift (lock vs live .yalc/) AND hand-edits to
      # .contract-lock.json that slipped past the local pre-commit hook (e.g.
      # `--no-verify`, or a clone without Husky). Deterministic: excludes only the
      # volatile generatedAt/sha, so it never false-positives.
      - name: Verify .contract-lock.json is not hand-edited
        run: |
          node scripts/check-contract-lock.mjs || {
            echo "::error::.contract-lock.json was hand-edited or is stale."
            echo "::error::Run: node scripts/generate-contract-lock.mjs && git add .contract-lock.json"
            exit 1
          }

  setup:
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve producer refs for parity with current branch
        id: producers
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
        run: |
          # Prefer same-named branches on the producer repos (cross-repo
          # coordinated PRs); otherwise fall back to main.
          # design-system-Lifegames is public (plain ls-remote); the backend
          # mantle-LifegamesPortal is private (token-authed ls-remote).
          DS_REPO_URL=https://github.com/j0nathan-ll0yd/design-system-Lifegames.git
          LP_REPO_URL="https://x-access-token:${LP_REPO_TOKEN}@github.com/j0nathan-ll0yd/mantle-LifegamesPortal.git"
          # actions/checkout persists a GITHUB_TOKEN extraheader in the
          # workspace .git/config; ls-remote run from the workspace inherits it
          # and it clobbers the URL credentials (GITHUB_TOKEN cannot read the
          # private backend). Neutralize it for these lookups.
          lsr() { git -c "http.https://github.com/.extraheader=" ls-remote "$@" | cut -f1; }
          resolve_ref() {
            local repo_url="$1" out_prefix="$2" candidate_sha=""
            if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "main" ]; then
              candidate_sha=$(lsr "$repo_url" "refs/heads/$HEAD_REF")
            fi
            if [ -n "$candidate_sha" ]; then
              echo "[$out_prefix] using matching branch: $HEAD_REF ($candidate_sha)"
              echo "${out_prefix}_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
              echo "${out_prefix}_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
            else
              local main_sha
              main_sha=$(lsr "$repo_url" refs/heads/main)
              if [ -z "$main_sha" ]; then
                echo "::error::[$out_prefix] could not resolve ANY ref (branch '$HEAD_REF' or main) — auth or connectivity problem, refusing to build against an unknown producer state"
                exit 1
              fi
              echo "[$out_prefix] no matching branch for '$HEAD_REF'; falling back to main ($main_sha)"
              echo "${out_prefix}_ref=main" >> "$GITHUB_OUTPUT"
              echo "${out_prefix}_sha=$main_sha" >> "$GITHUB_OUTPUT"
            fi
          }
          resolve_ref "$DS_REPO_URL" ds
          resolve_ref "$LP_REPO_URL" lp

      - name: Setup design-system + install dependencies
        env:
          DS_REF: ${{ steps.producers.outputs.ds_ref }}
          LP_REF: ${{ steps.producers.outputs.lp_ref }}
          LP_REPO_TOKEN: ${{ secrets.LP_REPO_TOKEN }}
        run: bash scripts/ci-setup.sh

      - name: Run unit tests (app-owned client runtime)
        run: npm run test:unit

      - name: Build Astro site
        run: npm run build

      - name: Upload DS+dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-tests-ds-dist
          path: |
            .yalc
            yalc.lock
            dist
          retention-days: 1
          include-hidden-files: true

    outputs:
      ds-sha: ${{ steps.producers.outputs.ds_sha }}
      lp-sha: ${{ steps.producers.outputs.lp_sha }}

  visual-tests:
    needs: setup
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 4-shard matrix matches the fleet's MAX_RUNNERS=10 with CONTAINER_CPUS=4
        # comfortably (4 shards * 4 cores = 16 cores out of 28 hardware cores).
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download DS+dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: visual-tests-ds-dist

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run visual regression tests
        env:
          # SKIP_BUILD reuses the dist/ from setup -- saves rebuilding per shard.
          SKIP_BUILD: 'true'
        # In update_snapshots mode, force workers=1 to eliminate the within-shard
        # write race that produces truncated PNGs (microsoft/playwright#9760).
        # Validation mode keeps the playwright.config.ts default (workers='50%' in CI).
        # Browsers are PREINSTALLED in the runner image -- do NOT add `npx playwright install`.
        run: npx playwright test --shard=${{ matrix.shard }}/4 ${{ (inputs.update_snapshots || false) && '--update-snapshots --workers=1' || '' }}

      - name: Upload regenerated baselines
        if: ${{ (inputs.update_snapshots || false) && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regenerated-baselines-shard-${{ matrix.shard }}
          path: tests/visual/__screenshots__/
          retention-days: 1
          include-hidden-files: true

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-test-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  behavioral:
    # BookModal interaction suite (tests/behavioral/). Runs on the SAME self-hosted
    # parity runner as the visual shards so all Playwright execution goes through the
    # canonical noble image (locally: scripts/run-in-docker.sh; CI: the runner is
    # built FROM that image). It asserts DOM/interaction, not pixels, so it reuses
    # the dist/ built by `setup` (SKIP_BUILD) rather than its own build.
    needs: setup
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download DS+dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: visual-tests-ds-dist

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run behavioral (interaction) tests
        # Reuses dist/ from setup. Browsers are PREINSTALLED in the runner image
        # -- do NOT add `npx playwright install`.
        env:
          SKIP_BUILD: 'true'
        run: npx playwright test --config=playwright.behavioral.config.ts

      - name: Upload behavioral report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: behavioral-playwright-report
          path: playwright-report
          retention-days: 14

  commit-baselines:
    # Run whenever an update was requested and the workflow was not cancelled --
    # INCLUDING when a shard failed, so the guard step below can abort loudly. A
    # crashed shard must never silently commit a stale/mixed baseline set.
    if: ${{ (inputs.update_snapshots || false) && !cancelled() }}
    runs-on: [self-hosted, linux, arm64, playwright]
    needs: visual-tests
    permissions:
      contents: write
    steps:
      - name: Abort unless every visual-tests shard succeeded
        # A crashed/failed shard leaves its ~1/4 of the files equal to the
        # checked-out base -- indistinguishable from "correctly unchanged" -- so a
        # partial regeneration could commit a stale 1x/2x MIX. Fail closed.
        run: |
          result='${{ needs.visual-tests.result }}'
          if [ "$result" != "success" ]; then
            echo "::error::visual-tests result is '$result', not 'success'. Refusing to reconstruct/commit baselines from a partial regeneration."
            exit 1
          fi
          echo "all visual-tests shards succeeded"
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        # No `ref:` -- workflow_dispatch runs on the selected branch, and the
        # auto-commit action needs a branch (not a detached SHA) to push back.
      - name: Preserve the committed baselines as the reconstruction base
        run: cp -r tests/visual/__screenshots__ /tmp/base
      - name: Download each shard artifact to a SEPARATE directory
        # NOT merge-multiple. Each of the 4 shards uploaded the WHOLE __screenshots__
        # tree but freshly rendered only its own ~1/4; the old merge-multiple was
        # last-write-wins across those full trees, so a mass 1x->2x regen could
        # commit whichever copy landed last -- a nondeterministic 1x/2x mix. Keeping
        # shards isolated lets us pick, per file, the single shard that changed it.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/shards
          pattern: regenerated-baselines-shard-*
      - name: Mark workspace as safe (container uid mismatch)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Reconstruct baselines (per file, take the shard that changed it)
        # Pure bash + coreutils (the noble image has them; no npm ci needed). For
        # every committed baseline, take the ONE shard copy whose bytes differ from
        # base; if none differ, keep base. Deterministic -- independent of artifact
        # download order -- which is what the old merge-multiple was not.
        run: |
          set -euo pipefail
          screens="$GITHUB_WORKSPACE/tests/visual/__screenshots__"
          shopt -s nullglob
          shards=(/tmp/shards/regenerated-baselines-shard-*)
          echo "reconstructing from ${#shards[@]} shard artifact(s)"
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "::error::no shard artifacts were downloaded"; exit 1
          fi
          changed=0
          # 1) Existing baselines: pick the shard copy that differs from base.
          while IFS= read -r -d '' basefile; do
            rel="${basefile#/tmp/base/}"
            for s in "${shards[@]}"; do
              cand="$s/$rel"
              [ -f "$cand" ] || continue
              if ! cmp -s "$basefile" "$cand"; then
                mkdir -p "$(dirname "$screens/$rel")"
                cp "$cand" "$screens/$rel"
                changed=$((changed + 1))
                break
              fi
            done
          done < <(find /tmp/base -type f -name '*.png' -print0)
          # 2) Brand-new baselines: present in a shard but absent from base.
          for s in "${shards[@]}"; do
            while IFS= read -r -d '' shardfile; do
              rel="${shardfile#"$s"/}"
              if [ ! -e "/tmp/base/$rel" ]; then
                mkdir -p "$(dirname "$screens/$rel")"
                cp "$shardfile" "$screens/$rel"
                changed=$((changed + 1))
              fi
            done < <(find "$s" -type f -name '*.png' -print0)
          done
          echo "reconstructed $changed changed/new baseline(s)"
      - name: Commit regenerated baselines
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: regenerate visual baselines via self-hosted arm64 CI"
          file_pattern: 'tests/visual/__screenshots__/**'

  merge-reports:
    # Run on shard success OR failure (the HTML report is most valuable on
    # failure), but not when shards were skipped/cancelled — there are no blob
    # reports to merge then, and the explicit condition overrides the implicit
    # success() gate from `needs`.
    if: ${{ !cancelled() && contains(fromJSON('["success", "failure"]'), needs.visual-tests.result) }}
    runs-on: [self-hosted, linux, arm64, playwright]
    needs: visual-tests
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install dependencies (Playwright CLI only)
        run: npm ci --legacy-peer-deps
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
