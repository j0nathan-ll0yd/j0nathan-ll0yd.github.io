name: Visual Regression Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    outputs:
      ds-sha: ${{ steps.ds-info.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve DS HEAD SHA for cache key
        id: ds-info
        run: |
          DS_SHA=$(git ls-remote https://github.com/j0nathan-ll0yd/design-system-Lifegames.git refs/heads/main | cut -f1)
          echo "sha=$DS_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore DS+dist cache
        uses: actions/cache@v4
        id: ds-cache
        with:
          path: |
            .yalc
            yalc.lock
            dist
          key: ds-dist-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/ci-setup.sh') }}-ds-${{ steps.ds-info.outputs.sha }}

      - name: Setup design-system + install dependencies
        if: steps.ds-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-setup.sh

      - name: Build Astro site
        if: steps.ds-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Upload DS+dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: visual-tests-ds-dist
          path: |
            .yalc
            yalc.lock
            dist
          retention-days: 1
          include-hidden-files: true

  visual-tests:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Download DS+dist artifact
        uses: actions/download-artifact@v8
        with:
          name: visual-tests-ds-dist

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run visual regression tests
        env:
          SKIP_BUILD: 'true'
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  merge-reports:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: visual-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (Playwright CLI only)
        run: npm ci --legacy-peer-deps
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
