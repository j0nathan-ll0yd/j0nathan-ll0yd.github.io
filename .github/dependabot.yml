version: 2

# The seven @j0nathan-ll0yd/* dependencies (copy, fixtures, portal-contract,
# schemas, tokens, web, config) resolve from GitHub Packages, which requires
# authentication even though every one of them is public -- an unauthenticated
# GET of https://npm.pkg.github.com/@j0nathan-ll0yd%2fconfig returns 401.
# Without this block Dependabot cannot see the internal packages at all, so a
# published bump never reaches this consumer and the site silently keeps
# building against a stale tarball.
#
# The token must live in the *Dependabot* secret store (Settings -> Secrets and
# variables -> Dependabot), not the Actions one: Dependabot never sees the
# workflow GITHUB_TOKEN, and GitHub forbids Dependabot secret names beginning
# with `GITHUB_`, so `${{secrets.GITHUB_TOKEN}}` is not expressible here.
# `read:packages` is the only scope required.
#
# Deliberately NOT set:
#   replaces-base -- would route *every* dependency through GitHub Packages,
#     which does not proxy registry.npmjs.org.
#   scope         -- would make Dependabot regenerate .npmrc purely from these
#     credentials and discard the committed one. Since the pnpm migration (atlas
#     decision 0032) the committed .npmrc is nothing BUT the
#     `@j0nathan-ll0yd:registry=` scope mapping, so regenerating it would be a
#     near-no-op rather than the breakage it used to be -- but leaving it unset
#     keeps the mapping under version control, which is where it belongs.
#
# `package-ecosystem: npm` is correct under pnpm: Dependabot's npm ecosystem
# handles package-lock.json, yarn.lock AND pnpm-lock.yaml. It reads the pnpm
# lockfile and the `overrides:` block in pnpm-workspace.yaml.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GH_PACKAGES_READ_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Declared FIRST on purpose: a dependency lands in the first group it
      # matches, and the internal packages must never be split across the
      # framework groups below.
      #
      # The @j0nathan-ll0yd/* set is interdependent (fixtures -> schemas -> web
      # -> tokens/copy, and portal-contract underneath schemas/fixtures), so six
      # racing single-package PRs would each red the typecheck until the last
      # one merged. One grouped PR lands the set together.
      #
      # MAJORS ARE INCLUDED: major/minor/patch are listed explicitly, and no
      # `ignore` rule below matches this scope. Dependabot still only sees
      # versions that were actually published, so the Atlas package-version-drift
      # reconciliation runner remains the backstop for source that changed
      # without a version bump -- Dependabot cannot detect that case at all.
      lifegames-internal:
        patterns:
          - "@j0nathan-ll0yd/*"
        update-types:
          - major
          - minor
          - patch
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      vite-pwa:
        patterns:
          - "@vite-pwa/*"
          - vite-plugin-pwa
          - "workbox-*"
      # Note: This group coordinates npm packages only. Docker image tag race is handled by the manifest-inspect guard in resolve-version job.
      playwright:
        patterns:
          - "@playwright/*"
    ignore:
      # Astro major bumps require manual testing of every page and widget.
      - dependency-name: astro
        update-types:
          - version-update:semver-major
      # @vite-pwa/astro caps its astro peer at ^5 (mismatch with Astro 7) --
      # handled by `strictPeerDependencies: false` plus the `overrides` pin of
      # vite-plugin-pwa ^1.3.0 for vite-8 support, both in pnpm-workspace.yaml.
      # Major bumps risk breaking that workaround and the SW precache injection
      # (scripts/check-sw-precache.mjs).
      - dependency-name: "@vite-pwa/*"
        update-types:
          - version-update:semver-major
      - dependency-name: vite-plugin-pwa
        update-types:
          - version-update:semver-major
      # @napi-rs/image ships the native oxipng used to losslessly optimize the
      # committed visual baselines (tests/visual/global-teardown.ts). Pinned
      # exactly: a major bump can change the underlying oxipng core and thus the
      # optimized PNG bytes, which would force a full baseline regeneration and
      # re-validation of the local<->CI byte-parity gate. Bump deliberately.
      - dependency-name: "@napi-rs/image"
        update-types:
          - version-update:semver-major
      # typescript is pinned to ^5 (<6.0.0). The latest published TypeScript is
      # the native TS 7 line, but @astrojs/check (peer ^5 || ^6) and
      # typescript-eslint v8 (peer >=4.8.4 <6.1.0) do not support it. Adopt a
      # newer major only when both the astro check toolchain and typescript-eslint
      # declare support; until then Dependabot must not open TS major-bump PRs.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
