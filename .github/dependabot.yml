version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      vite-pwa:
        patterns:
          - "@vite-pwa/*"
          - vite-plugin-pwa
          - "workbox-*"
      # Note: This group coordinates npm packages only. Docker image tag race is handled by the manifest-inspect guard in resolve-version job.
      playwright:
        patterns:
          - "@playwright/*"
    ignore:
      # Astro major bumps require manual testing of every page and widget.
      - dependency-name: astro
        update-types:
          - version-update:semver-major
      # @vite-pwa/astro has known peer-dep mismatch with Astro 6 -- handled
      # by --legacy-peer-deps. Major bumps risk breaking that workaround.
      - dependency-name: "@vite-pwa/*"
        update-types:
          - version-update:semver-major
      - dependency-name: vite-plugin-pwa
        update-types:
          - version-update:semver-major
      # @napi-rs/image ships the native oxipng used to losslessly optimize the
      # committed visual baselines (tests/visual/global-teardown.ts). Pinned
      # exactly: a major bump can change the underlying oxipng core and thus the
      # optimized PNG bytes, which would force a full baseline regeneration and
      # re-validation of the local<->CI byte-parity gate. Bump deliberately.
      - dependency-name: "@napi-rs/image"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
