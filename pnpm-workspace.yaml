# pnpm 11 settings for this repo. SETTINGS-ONLY -- there is deliberately no
# `packages:` key: human-datastream is a single-package project, not a monorepo.
# pnpm 11 no longer reads pnpm settings from `.npmrc`, and it ignores a
# `package.json` "overrides"/"pnpm.overrides" field, so everything below lives
# here or it silently does nothing. See atlas decision 0032 (baseline items 4-5).

# Translated from the npm-only `package.json` "overrides" block (npm read it;
# pnpm does not). @vite-pwa/astro drives vite-plugin-pwa/Workbox; only
# vite-plugin-pwa >=1.3.0 declares a vite-8 peer, which Astro 7 bundles
# (Rolldown). Without this pin the wrapper resolves an older vite-plugin-pwa and
# the SW precache manifest injection is at risk -- scripts/check-sw-precache.mjs
# is the standing build-time guard. Keep in lockstep with the `vite-pwa` group +
# major-bump ignore rules in .github/dependabot.yml.
overrides:
  vite-plugin-pwa: ^1.3.0
  # Security: force the patched nanoid across the transitive tree. nanoid < 3.3.18
  # (resolved 3.3.16 here, pulled in transitively) is GHSA-2v37-7h3g-55p8 --
  # predictable output when fed a non-integer size. No direct dependency, so this
  # override is the pin; Dependabot's normal patch bumps still apply on top. Drop
  # once every parent's range floats to >=3.3.18 on its own.
  nanoid@<3.3.18: ^3.3.18
  # Security: brace-expansion 2.x < 2.1.7 is GHSA-q2hr-2g5m-vwhr. Pulled by
  # minimatch 5.1.9 < filelist < jake < ejs < workbox-build (vite-plugin-pwa).
  # minimatch's `^2.0.1` already admits the fix; the lockfile snapshot does not
  # move under `pnpm update --depth Infinity`. Drop once
  # `pnpm why brace-expansion` shows no 2.x below 2.1.7 without this.
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  # Security: qs < 6.16.0 is GHSA-q8mj-m7cp-5q26 (6.11.1-6.15.1, the Dependabot
  # alert), GHSA-x5fp-wj9c-mxmx (6.14.2-6.15.3) and GHSA-4mjr-xmp4-gh2g
  # (2.2.5-6.15.x); pnpm audit reports all three and 6.16.0 is the only release
  # clearing every one. Three parents hold qs below it: typed-rest-client 2.3.1
  # (via @stryker-mutator/core 9.6.1, `~2.3.0`; Stryker 10.0.0 keeps that range)
  # pins `qs: 6.15.1` exactly, and express 4.22.2 and its body-parser 1.20.6
  # (via @lhci/cli) both declare `~6.15.1`. 6.16.0 is a semver minor of the same
  # 6.x API. Drop once `pnpm why qs` resolves >=6.16.0 without this entry, i.e.
  # typed-rest-client, express and body-parser all admit it.
  qs@<6.16.0: ^6.16.0
  # Security: basic-ftp <= 6.2.0 is GHSA-c475-qrg2-pj4r (reported by pnpm audit;
  # no Dependabot alert yet). Pulled by get-uri 6.0.5 (`^5.0.2`) < pac-proxy-agent
  # < proxy-agent (@lhci/cli, @puppeteer/browsers); even the latest get-uri
  # (8.0.1) declares `^5.3.1`, so this is a forced major. 6.0.0's only breaking
  # change disables separate FTP transfer hosts by default (a security default),
  # and the Client methods get-uri calls (access, lastMod, list, downloadTo,
  # close) keep identical signatures in 6.2.3's Client.d.ts. Drop once
  # `pnpm why basic-ftp` resolves >=6.2.1 without this entry (a get-uri release
  # alone is not enough until pac-proxy-agent's range admits it).
  basic-ftp@<6.2.1: ^6.2.1
  # Security: tmp <= 0.2.3 is GHSA-52f5-9888-hmc6; tmp < 0.2.6 is
  # GHSA-ph9p-34f9-6g65. Pulled
  # by @lhci/cli 0.15.1 (`^0.1.0`, `tmp.fileSync` in `lhci open`) and by
  # inquirer 6 > external-editor 3.1.0 (`^0.0.33`, `tmpNameSync` in the
  # interactive `lhci wizard`). Both calls exist unchanged in 0.2.x. @lhci/cli
  # 0.15.1 is the latest release (2025-06). Drop once @lhci/cli ships a tmp
  # >=0.2.6 range, or once @lhci/cli leaves the tree.
  tmp@<0.2.6: ^0.2.6
  # Security: uuid < 11.1.1 is GHSA-w5hq-g745-h8pq (v3/v5/v6 with a caller
  # buffer). @lhci/cli 0.15.1 declares `^8.3.1` and calls only `uuid.v4()`
  # (src/collect/node-runner.js), which 11.x still exports through its CJS
  # entry. Major jump verified: `require('@lhci/cli/src/collect/node-runner.js')`
  # loads and `uuid.v4()` returns a UUID on 11.1.1, and `lhci collect` runs.
  # Drop under the same @lhci/cli condition as tmp.
  uuid@<11.1.1: ^11.1.1
  # Security: serialize-javascript < 7.1.3 is GHSA-m5mm-p8h7-m29v (Dependabot
  # #188). Pulled by @rollup/plugin-terser 1.0.0 (`^7.0.3`) < workbox-build <
  # vite-plugin-pwa, so the range already admits the fix, but
  # `pnpm update --depth Infinity serialize-javascript` keeps 7.0.5 in the
  # lockfile snapshot (a fresh install resolves 7.1.x). Same shape as
  # brace-expansion above. Drop once `pnpm why serialize-javascript`
  # resolves >=7.1.3 without this entry.
  serialize-javascript@<7.1.3: ^7.1.3

# Translated from the npm-only `.npmrc` `legacy-peer-deps=true`. @vite-pwa/astro
# (<=1.2.0) caps its astro peer at ^5 while this project is on astro 7, so a
# strict install fails outright. This is the STANDING state, not a soon-to-be-
# removed patch: the published peer range never covered astro 6 either. Drop
# this and the override above together, once @vite-pwa/astro publishes an
# astro-7 peer range.
strictPeerDependencies: false

# Supply-chain floor (decision 0032 baseline item 5). pnpm 11 already defaults
# to 1440 minutes (24h); setting it explicitly makes the posture legible and
# gate-checkable instead of an invisible default.
minimumReleaseAge: 1440

# Same-day first-party releases must bypass minimumReleaseAge or frozen production deploys fail
# for 24 hours. Only the nine @j0nathan-ll0yd packages are excluded; third-party dependencies
# retain the supply-chain age floor. Bare names keep future internal versions deployable.
#
# @j0nathan-ll0yd/estate-contracts was the eighth (atlas decision 0079 item 4 wave 2b). Its source of
# truth is `j0nathan-ll0yd/atlas`, and it carries the normative cross-repo contracts this repo used
# to vendor verbatim. A rule change lands as an atlas release plus a lockfile bump here, so blocking
# that bump for 24 hours would reintroduce the coordination lag the published package exists to
# delete. The age floor blunts third-party supply-chain attacks; a package the estate publishes
# itself is not that threat model.
minimumReleaseAgeExclude:
  - '@j0nathan-ll0yd/config'
  - '@j0nathan-ll0yd/copy'
  - '@j0nathan-ll0yd/estate-contracts'
  - '@j0nathan-ll0yd/fixtures'
  - '@j0nathan-ll0yd/observability'
  - '@j0nathan-ll0yd/portal-contract'
  - '@j0nathan-ll0yd/schemas'
  - '@j0nathan-ll0yd/tokens'
  - '@j0nathan-ll0yd/web'

# Lifecycle scripts are blocked by default under pnpm 11 (strictDepBuilds). This
# is the explicit, audited allowlist decision 0032 item 5 requires -- NOT a
# blanket enable. It is exactly the set pnpm reported as blocked against the
# resolved tree (audited 2026-08-12); every other dependency declares no build,
# so listing it would be dead config.
allowBuilds:
  # Native (napi) oxipng module used by tests/visual/global-teardown.ts to
  # losslessly optimize the committed visual baselines. Ships its binary via
  # @napi-rs/image-<platform> optional deps, so approving it only clears pnpm's
  # native-package gate -- there is no source build to run.
  '@napi-rs/image': true
  # postinstall downloads the platform binary. Without it `dprint fmt` /
  # `dprint check` cannot run -- that is the blocking format gate
  # (format-check.yml, .husky/pre-push) plus the pre-commit auto-format.
  dprint: true
  # postinstall links the platform binary Vite/Rolldown shells out to during the
  # Astro build.
  esbuild: true
  # install script verifies the prebuilt libvips binary shipped by the @img/sharp-*
  # optional deps. Astro's image service needs it at build time.
  sharp: true
  # postinstall installs the workerd platform binary that backs `wrangler`
  # (`wrangler dev` and the Miniflare test runs).
  workerd: true
  # DENIED DELIBERATELY. Transitive via pa11y-ci. Its postinstall downloads a
  # ~200MB Chrome-for-Testing build that is never used: the only place pa11y-ci
  # runs is audit-web.yml, which sets PUPPETEER_EXECUTABLE_PATH to the Playwright
  # chromium it already installed, precisely to avoid a redundant Chrome download
  # (see the comment on that job's "Install Playwright Chromium" step). npm ran
  # this postinstall on every install; skipping it removes that waste from all
  # seven workflows. Flip to `true` only if pa11y is ever run WITHOUT
  # PUPPETEER_EXECUTABLE_PATH set.
  puppeteer: false
